<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Odontogram</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f4;--ink:#1c2b33;--mute:#5d707a;--tooth:#fdfdfa;--line:#8aa0aa;--card:#fff;--bd:#d3dde2;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121b20;--ink:#e6eef1;--mute:#93a6af;--tooth:#e9ece6;--line:#5f7580;--card:#1a262c;--bd:#2c3d45}}
:root[data-theme="dark"]{--bg:#121b20;--ink:#e6eef1;--mute:#93a6af;--tooth:#e9ece6;--line:#5f7580;--card:#1a262c;--bd:#2c3d45}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Instrument Sans",system-ui,sans-serif}
main{max-width:680px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0}
p{margin:0 0 12px;color:var(--mute)}
.bar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.bar button,.row button{border:1px solid var(--bd);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 10px;font:inherit;font-size:13px;display:flex;align-items:center;gap:6px;cursor:pointer}
.bar button[aria-pressed=true]{outline:2px solid var(--ink)}
button:focus-visible{outline:2px solid #3b82c4}
.dot{width:10px;height:10px;border-radius:50%}
#chart{background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden}
svg{display:block;width:100%;height:auto}
.s{cursor:pointer;stroke:var(--line);stroke-width:1}
.s:hover{opacity:.7}
.num{font-size:10px;fill:var(--mute);text-anchor:middle;dominant-baseline:middle;pointer-events:none}
.bdg{font-size:9px;font-weight:600;text-anchor:middle;dominant-baseline:middle;pointer-events:none}
h2{font-size:15px;margin:16px 0 6px}
#sum{margin:0;padding:0;list-style:none}
#sum li{padding:6px 0;border-bottom:1px solid var(--bd)}
textarea{width:100%;height:110px;background:var(--card);color:var(--ink);border:1px solid var(--bd);border-radius:8px;padding:8px;font:12px monospace}
.row{display:flex;gap:8px;margin-top:8px}
</style>
</head>
<body>
<main>
<h1>Odontogram</h1>
<p dir="auto">اختار العرض والتشخيص، وبعدين اضغط على السن. التسوس والحشو بيتلونوا على السطح، والباقي على السن كله. FDI numbering.</p>
<div class="bar" id="views"></div>
<div class="bar" id="tools"></div>
<div id="chart"><svg id="svg" viewBox="0 0 700 560" role="img" aria-label="Dental chart"></svg></div>
<h2>Findings</h2>
<ul id="sum"></ul>
<h2>Data (JSON)</h2>
<textarea id="out" readonly></textarea>
<div class="row"><button id="copy">Copy JSON</button><button id="reset">Reset chart</button></div>
</main>
<script>
const svg=document.getElementById('svg'),tl=document.getElementById('tools'),vw=document.getElementById('views'),sum=document.getElementById('sum');
const D={caries:{s:1,c:'#d64545',n:'Caries'},filling:{s:1,c:'#3b82c4',n:'Filling'},
missing:{c:'#7a8790',n:'Missing',k:'X'},crown:{c:'#c9962b',n:'Crown',k:'Cr'},implant:{c:'#12938a',n:'Implant',k:'Imp'},
rct:{c:'#8b5cc4',n:'RCT',k:'RCT'},mobility:{c:'#e07b2c',n:'Mobility',k:'Mob'},furcation:{c:'#c2418d',n:'Furcation',k:'Fur'},
bone:{c:'#8a6d3b',n:'Bone loss',k:'BL'},recession:{c:'#3f9d3a',n:'Recession',k:'Rec'},attrition:{c:'#5b5fc7',n:'Attrition',k:'Att'},extract:{c:'#b3261e',n:'Extract',k:'Ext'},clear:{c:'#9aa9b1',n:'Clear tooth'}};
const UP=[18,17,16,15,14,13,12,11,21,22,23,24,25,26,27,28],LO=[48,47,46,45,44,43,42,41,31,32,33,34,35,36,37,38];
let tool='caries',view='arch',st={};
try{st=JSON.parse(localStorage.getItem('odo')||'{}')}catch(e){}
const get=n=>st[n]||(st[n]={s:{},f:[]});
const type=n=>[0,'I','I','C','P','P','M','M','M'][n%10];
const SH={I:a=>`<rect x="5" y="7" width="22" height="18" rx="3" ${a}/>`,C:a=>`<ellipse cx="16" cy="16" rx="11" ry="13" ${a}/>`,
P:a=>`<ellipse cx="16" cy="16" rx="13" ry="11" ${a}/>`,M:a=>`<rect x="1" y="2" width="30" height="28" rx="10" ${a}/>`};
const BB={I:[5,7,27,25,6,5],C:[5,3,27,29,6,6],P:[3,5,29,27,7,6],M:[1,2,31,30,9,9]};
const DEFS='<defs>'+['I','C','P','M'].map(t=>`<clipPath id="c${t}">${SH[t]('')}</clipPath>`).join('')+'</defs>';
const PR={I:{w:22,h:46,r:['M-7 0L-2 -60Q0 -64 2 -60L7 0Z']},C:{w:24,h:50,r:['M-8 0L-2 -74Q0 -78 2 -74L8 0Z']},
P:{w:28,h:40,r:['M-9 0L-2 -58Q0 -62 2 -58L9 0Z']},M:{w:36,h:34,r:['M-16 0L-12 -52Q-8 -58 -5 -50L-1 0Z','M1 0L5 -50Q8 -58 12 -52L16 0Z']}};
const CX=350,RX=280,RY=190;
const LAY=[];[[UP,265,-1],[LO,295,1]].forEach(([arr,cy,dir])=>arr.forEach((n,i)=>{
const t=(170-i*(160/15))*Math.PI/180,x=CX+RX*Math.cos(t),y=cy+dir*RY*Math.sin(t);
let nx=Math.cos(t)/RX,ny=dir*Math.sin(t)/RY,m=Math.hypot(nx,ny);nx/=m;ny/=m;
LAY.push({n,x,y,nx,ny,rot:Math.atan2(nx,-ny)*180/Math.PI,up:dir<0,right:i>=8})}));
const T='M-4.5 -6Q0 -8 4.5 -6Q6 -2 4 2L3 7Q2 8 1 6L0 3L-1 6Q-2 8 -3 7L-4 2Q-6 -2 -4.5 -6Z';
const IC={
caries:c=>`<path d="${T}"/><circle cx="0" cy="-2" r="2.4" fill="${c}"/>`,
filling:c=>`<path d="${T}"/><rect x="-2.6" y="-4.6" width="5.2" height="4.6" rx="1" fill="${c}"/>`,
missing:c=>`<path d="${T}" stroke-dasharray="2 2" opacity=".6"/><path d="M-3.5 -3.5L3.5 3.5M3.5 -3.5L-3.5 3.5" stroke-width="1.8"/>`,
crown:c=>`<path d="M-6 3V-4L-3 -1L0 -6L3 -1L6 -4V3Z" fill="${c}" fill-opacity=".3"/><path d="M-6 6.5H6"/>`,
implant:c=>`<rect x="-4" y="-7.5" width="8" height="3" rx="1" fill="${c}" fill-opacity=".3"/><path d="M-2.8 -4.5H2.8L1.8 7.5H-1.8Z"/><path d="M-2.4 -1.5H2.4M-2.1 1.5H2.1M-1.9 4.5H1.9"/>`,
rct:c=>`<path d="${T}"/><path d="M0 -3V4" stroke-width="2.6"/>`,
mobility:c=>`<g transform="translate(0,-2.5) scale(.8)"><path d="${T}"/></g><path d="M-7 6.5H7M-7 6.5L-4.5 4.5M-7 6.5L-4.5 8.5M7 6.5L4.5 4.5M7 6.5L4.5 8.5"/>`,
furcation:c=>`<path d="M-6 -7.5H6V-2.5H-6Z" fill="${c}" fill-opacity=".3"/><path d="M-4 -2.5L-5 7.5M4 -2.5L5 7.5"/><circle cx="0" cy="1" r="2" fill="${c}"/>`,
bone:c=>`<path d="M-3 -8V3.5L0 8L3 3.5V-8"/><path d="M-8 -4.5H-4" stroke-dasharray="1.6 1.4"/><path d="M4 2H8"/><path d="M6 -3.5V-0.5M4.6 -2L6 -0.5L7.4 -2"/>`,
recession:c=>`<path d="M-4 -8H4V-3H-4Z" fill="${c}" fill-opacity=".3"/><path d="M-3 -3L0 8L3 -3"/><path d="M-8 3Q-4 3 -3 0M8 3Q4 3 3 0"/><path d="M6.5 -7V-2M5 -3.5L6.5 -2L8 -3.5"/>`,
attrition:c=>`<path d="M-5 -2L-2.5 -6.5L0 -2L2.5 -6.5L5 -2" stroke-dasharray="1.8 1.6" opacity=".7"/><path d="M-5 -2H5V6.5Q0 8 -5 6.5Z" fill="${c}" fill-opacity=".3"/>`,
extract:c=>`<path d="M0 -1V-8M-3 -5L0 -8L3 -5"/><g transform="translate(0,4) scale(.7)"><path d="${T}"/></g>`,
clear:c=>`<circle r="5.5"/><path d="M-4 -4L4 4"/>`};
function ic(k,x,y){return `<g transform="translate(${x},${y})" fill="none" stroke="${D[k].c}" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" pointer-events="none">${IC[k](D[k].c)}</g>`}
function info(n){const d=get(n);return{d,miss:d.f.includes('missing'),rf:d.f.filter(f=>f!='missing'),cs:d.f.filter(f=>D[f].k)}}
function rings(rf,shape){const n=rf.length,u=100/(n*8);
return shape(`fill="none" stroke="var(--line)" stroke-width="1" pointer-events="none"`)+rf.map((f,i)=>shape(`fill="none" pathLength="100" stroke="${D[f].c}" stroke-width="3" pointer-events="none"`+(n>1?` stroke-dasharray="${u} ${u*(n-1)}" stroke-dashoffset="${-i*u}"`:''))).join('')}
function arch(){let h=DEFS;
LAY.forEach(o=>{const{d,miss,rf,cs}=info(o.n),t=type(o.n),ck=(t=='I'||t=='C')?'I':'O',ml=(o.up===o.right),
[x0,y0,x1,y1,ix,iy]=BB[t],a=x0+ix,b=y0+iy,c=x1-ix,e=y1-iy,
sf={B:`${x0},${y0} ${x1},${y0} ${c},${b} ${a},${b}`,L:`${x0},${y1} ${x1},${y1} ${c},${e} ${a},${e}`,[ml?'M':'D']:`${x0},${y0} ${a},${b} ${a},${e} ${x0},${y1}`,[ml?'D':'M']:`${x1},${y0} ${x1},${y1} ${c},${e} ${c},${b}`};
h+=`<g transform="translate(${o.x.toFixed(1)},${o.y.toFixed(1)}) rotate(${o.rot.toFixed(1)}) translate(-16,-16)" opacity="${miss?.4:1}">`+SH[t](`fill="var(--tooth)"`)+`<g clip-path="url(#c${t})">`;
for(const s in sf)h+=`<polygon class="s" data-n="${o.n}" data-s="${s}" points="${sf[s]}" fill="${d.s[s]?D[d.s[s]].c:'var(--tooth)'}"/>`;
h+=`<rect class="s" data-n="${o.n}" data-s="${ck}" x="${a}" y="${b}" width="${c-a}" height="${e-b}" fill="${d.s[ck]?D[d.s[ck]].c:'var(--tooth)'}"/></g>`;
if(d.f.includes('attrition'))h+=`<path d="M${a} ${b}L${c} ${e}M${c} ${b}L${a} ${e}" stroke="${D.attrition.c}" stroke-width="1.6" pointer-events="none"/>`;
h+=rings(rf,q=>SH[t](q));
if(miss)h+=`<path d="M2 2L30 30M30 2L2 30" stroke="#7a8790" stroke-width="2" pointer-events="none"/>`;
h+='</g>'+`<text class="num" x="${(o.x-o.nx*28).toFixed(1)}" y="${(o.y-o.ny*28).toFixed(1)}">${o.n}</text>`;
cs.forEach((f,j)=>h+=ic(f,(o.x+o.nx*(34+18*j)).toFixed(1),(o.y+o.ny*(34+18*j)).toFixed(1)))});
return h}
function perio(){let h='';
[[UP,150,1],[LO,280,-1]].forEach(([arr,gy,dir])=>arr.forEach((n,i)=>{
const x=20+40*i,G=PR[type(n)],{d,miss,rf,cs}=info(n),f=k=>d.f.includes(k);
h+=`<g transform="translate(${x},${gy}) scale(1,${dir})" opacity="${miss?.4:1}">`;
G.r.forEach(p=>h+=`<path class="s" data-n="${n}" data-s="R" d="${p}" fill="var(--tooth)"/>`);
h+=`<rect class="s" data-n="${n}" data-s="B" x="${-G.w/2}" y="0" width="${G.w}" height="${G.h}" rx="7" fill="${d.s.B?D[d.s.B].c:'var(--tooth)'}"/>`;
h+=rings(rf,q=>`<rect x="${-G.w/2}" y="0" width="${G.w}" height="${G.h}" rx="7" ${q}/>`);
if(f('furcation')&&G.r.length>1)h+=`<circle cx="0" cy="-8" r="4" fill="${D.furcation.c}" pointer-events="none"/>`;
if(f('recession'))h+=`<line x1="-15" x2="15" y1="-18" y2="-18" stroke="${D.recession.c}" stroke-width="2.5" pointer-events="none"/>`;
if(f('bone'))h+=`<line x1="-16" x2="16" y1="-32" y2="-32" stroke="${D.bone.c}" stroke-width="2" stroke-dasharray="4 3" pointer-events="none"/>`;
if(f('attrition'))h+=`<line x1="${-G.w/2}" x2="${G.w/2}" y1="${G.h+4}" y2="${G.h+4}" stroke="${D.attrition.c}" stroke-width="3" pointer-events="none"/>`;
if(miss)h+=`<path d="M${-G.w/2} 0L${G.w/2} ${G.h}M${G.w/2} 0L${-G.w/2} ${G.h}" stroke="#7a8790" stroke-width="2" pointer-events="none"/>`;
h+='</g>'+`<text class="num" x="${x}" y="215">${n}</text>`;
cs.forEach((k,j)=>h+=ic(k,x+(j%2-.5)*19,(dir>0?18:372)+18*Math.floor(j/2)))}));
return h}
function draw(){svg.setAttribute('viewBox',view=='arch'?'0 -40 700 640':'0 0 640 440');
svg.innerHTML=view=='arch'?arch():perio();summary()}
function summary(){const ls=[],out={};
[...UP,...LO].forEach(n=>{const d=st[n];if(!d)return;const p=[],by={};
for(const k in d.s)(by[d.s[k]]=by[d.s[k]]||[]).push(k);
for(const c in by)p.push(`${D[c].n} (${by[c].join('')})`);d.f.forEach(f=>p.push(D[f].n));
if(p.length){ls.push(`<li><b>${n}</b> — ${p.join(', ')}</li>`);out[n]={surfaces:d.s,flags:d.f}}});
sum.innerHTML=ls.join('')||'<li style="color:var(--mute)">No findings yet. Pick a diagnosis and tap a tooth.</li>';
document.getElementById('out').value=JSON.stringify(out,null,1);
try{localStorage.setItem('odo',JSON.stringify(st))}catch(e){}}
svg.addEventListener('click',e=>{const t=e.target.closest('[data-n]');if(!t)return;
const d=get(t.dataset.n),s=t.dataset.s;
if(tool=='clear'){d.s={};d.f=[]}
else if(D[tool].s){if(s=='R')return;d.s[s]==tool?delete d.s[s]:d.s[s]=tool}
else{d.f.includes(tool)?d.f=d.f.filter(f=>f!=tool):d.f.push(tool)}
draw()});
function bars(){tl.innerHTML=Object.keys(D).map(k=>`<button data-k="${k}" aria-pressed="${k==tool}"><svg width="20" height="20" viewBox="-8 -8 16 16">${ic(k,0,0)}</svg>${D[k].n}</button>`).join('');
vw.innerHTML=[['arch','Arch view'],['perio','Perio view']].map(([k,n])=>`<button data-v="${k}" aria-pressed="${k==view}">${n}</button>`).join('')}
tl.addEventListener('click',e=>{const b=e.target.closest('button');if(b){tool=b.dataset.k;bars()}});
vw.addEventListener('click',e=>{const b=e.target.closest('button');if(b){view=b.dataset.v;bars();draw()}});
document.getElementById('reset').onclick=()=>{st={};draw()};
document.getElementById('copy').onclick=()=>{const o=document.getElementById('out');o.select();try{navigator.clipboard.writeText(o.value)}catch(e){}};
bars();draw();
</script>
</body>
</html>
