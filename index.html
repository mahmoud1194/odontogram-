<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الساعة</title>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#1f2933;--mute:#6b7782}
@media (prefers-color-scheme:dark){:root{--ink:#eef2f4;--mute:#97a4ad}}
html,body{height:100%;margin:0;background:transparent}
body{display:flex;align-items:center;justify-content:center;color:var(--ink);font-family:"Readex Pro",system-ui,sans-serif;text-align:center}
.clock{padding:12px}
.time{direction:ltr;display:flex;align-items:baseline;justify-content:center;gap:.25em;font-variant-numeric:tabular-nums}
.hm{font-size:clamp(56px,22vw,120px);font-weight:300;line-height:1;letter-spacing:.02em}
.side{display:flex;flex-direction:column;align-items:flex-start;gap:2px;font-size:clamp(16px,5vw,26px);color:var(--mute)}
.sec{font-weight:500;color:var(--ink)}
.date{margin-top:10px;font-size:clamp(14px,4vw,20px);color:var(--mute)}
</style>
</head>
<body>
<div class="clock" role="timer" aria-live="off">
  <div class="time"><span class="hm" id="hm"></span><span class="side"><span class="sec" id="sec"></span><span id="ap"></span></span></div>
  <div class="date" id="date"></div>
</div>
<script>
const tf=new Intl.DateTimeFormat('ar-EG',{hour:'numeric',minute:'2-digit',second:'2-digit',hour12:true}),
df=new Intl.DateTimeFormat('ar-EG',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const $=id=>document.getElementById(id);
function tick(){
  const d=new Date(),p={};
  tf.formatToParts(d).forEach(x=>p[x.type]=x.value);
  $('hm').textContent=p.hour+':'+p.minute;
  $('sec').textContent=p.second;
  $('ap').textContent=p.dayPeriod;
  $('date').textContent=df.format(d);
}
tick();setInterval(tick,1000);
</script>
</body>
</html>
